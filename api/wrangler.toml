name = "mailops-api"
main = "src/index.ts"
compatibility_date = "2024-02-22"

[[d1_databases]]
binding = "DB"
database_name = "mailops-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "mailops-raw-emails"

